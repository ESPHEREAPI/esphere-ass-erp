zenbio.jwt.secret=VotreCleSecreteJWTTresLongueEtSecurisee123456789AbcDefGhiJklMnoPqrStUvWxYz
zenbio.jwtExpirationMs=86400000
zenbio.jwt.refresh-expiration-ms=604800000