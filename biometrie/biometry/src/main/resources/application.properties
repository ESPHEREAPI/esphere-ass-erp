# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=service-biometrie
server.port=8081

# Config Server
spring.cloud.config.uri=http://localhost:8888

# Encodage
spring.datasource.sql-script-encoding=UTF-8

# ============================================
# EUREKA CONFIGURATION
# ============================================
# \u2705 R\u00c9ACTIV\u00c9 pour que Gateway puisse trouver le service
eureka.client.enabled=true
eureka.client.serviceUrl.defaultZone=http://77.68.94.193:8762/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Configuration instance
eureka.instance.hostname=77.68.94.193
eureka.instance.ip-address=77.68.94.193
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Intervalles optimis\u00e9s (\u00e9vite les lenteurs)
eureka.client.registry-fetch-interval-seconds=30
eureka.client.lease-renewal-interval-in-seconds=30
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Health check
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# ============================================
# TRACING CONFIGURATION
# ============================================
spring.cloud.compatibility-verifier.enabled=false
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.endpoints.web.exposure.include=*

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/biometry?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=DeepWater@2021
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions Hikari (Optimis\u00e9)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# \u2705 CACHE D\u00c9SACTIV\u00c9
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Optimisations Hibernate
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# SERVER CONFIGURATION
# ============================================
server.connection-timeout=180000
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ============================================
# TRANSACTION CONFIGURATION
# ============================================
spring.transaction.default-timeout=180

# ============================================
# JWT AUTHENTICATION CONFIGURATION
# ============================================
jwt.secret=P4ssw0rd#2024!S3cur1ty@K3y$ForJWT&T0k3n*Authent1cat10n_VeryLongSecretKeyForHS512Algorithm
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.db.biometry.biometry=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.apache.tomcat=INFO
logging.level.org.apache.catalina=INFO

# Format des logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Fichier de logs
logging.file.name=logs/biometry-application.log
logging.file.max-size=10MB
logging.file.max-history=30

# ============================================
# JACKSON (JSON) CONFIGURATION
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=NON_NULL
